name: Build IPTV playlist 2

on:
  push:
    paths:
      - "channels.json"
      - "build_playlist_2.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build playlist
        run: python3 build_playlist_2.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist_2.m3u
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update playlist 2 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase
            git push
          fi
